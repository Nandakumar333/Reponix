name: Deploy / Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if version check matches (not recommended)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check package version change
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          NPM_VERSION=$(npm view reponix version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VERSION"
          echo "npm registry version: $NPM_VERSION"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Publish forced via manual dispatch."
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          elif [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "Package version ($LOCAL_VERSION) has already been published to npm. Skipping publication."
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "New package version detected: $LOCAL_VERSION (current on npm: $NPM_VERSION)"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run Typecheck
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Run Tests
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm run test

      - name: Build CLI Package
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm publish --workspace=packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git Tag
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ steps.check_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi
